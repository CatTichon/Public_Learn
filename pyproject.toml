[project]
name = "telegram-learning-bot"
version = "0.1.0"
description = "Adaptive gamified Telegram bot for individual learning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.4.1",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.1",
    "python-dotenv>=1.0.1",
    "redis>=5.0.1",
    "sqlalchemy>=2.0.25",
    "uvicorn[standard]>=0.27.0",
]

[project.optional-dependencies]
dev = ["black>=24.2.0", "pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.3.0", "aiosqlite>=0.19.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
